services:
  mongodb:
    image: mongo:8
    ports:
      - '27017:27017'
    volumes:
      - dbdata8:/data/db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-example}
  
  mongo-express:
    image: mongo-express
    restart: unless-stopped
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-root}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-example}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD:-example}@mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
      ME_CONFIG_SITE_BASEURL: "/news/mongo"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mongo.rule=PathPrefix(`/news/mongo`)"
      - "traefik.http.routers.mongo.entrypoints=web"
  
  news_api:
    image: general_news_crawler_api
    build:
      context: .
    environment:
      MONGODB_USERNAME: ${MONGO_USER:-root}
      MONGODB_PASSWORD: ${MONGO_PASSWORD:-example}
      MONGODB_URL: mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD:-example}@mongodb:27017/
    ports:
      - 5000:5000
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.news_api.rule=PathPrefix(`/news/api`)"
      - "traefik.http.routers.news_api.entrypoints=web"

  news_dashboard:
    image: general_news_crawler_dashboard
    build: 
      context: dashboard
    ports:
      - 8082:80
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.news_dashboard.rule=PathPrefix(`/news/dashboard`)"
      - "traefik.http.routers.news_dashboard.entrypoints=web"

  traefik:
    image: "traefik:v3.3"
    container_name: "traefik"
    command:
      #- "--log.level=DEBUG"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.web.address=:80"
      - "--accesslog=true"
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro"

    
volumes:
  dbdata8:
