[project]
requires-python = ">=3.10"
name = "general_news_crawler"
version = "0.2.0"
description = ""
authors = [
    {name = "Daniel Vilas Perulan", email="dvilas@csic.es"},
    {name = "Javier Vela", email = "javier.vela00@gmail.com"}
]
readme = "README.md"
license = "MIT"
dependencies = [
    "mongo (>=0.2.0,<0.3.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "pydantic-mongo (>=2.3.0)",
    "flask (>=3.1.0)",
    "bs4 (>=0.0.2)",
    "lxml (>=5.3.0)",
    "click (>=8.1.8)",
    "fastapi (>=0.115.8)",
    "uvicorn (>=0.34.0)",
    "requests (>=2.32.3)",
    "geopandas (>=1.1.1)",
    "geoplot (>=0.5.1)",
    "pyyaml (>=6.0.3,<7.0.0)"
]

[project.scripts]
crawler = "news_crawler.cli.app:main"

[tool.poetry]
packages = [{include = "news_crawler", from = "src"},{include = "news_api", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"