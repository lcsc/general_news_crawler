apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: news-crawler
    component: mongodb
  name: mongodb-data
  namespace: news-crawler
spec:
  #storageClassName: openebs-hostpath
  accessModes:
    - ReadWriteOnce
  volumeName: mongodb-data-pv
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  labels:
    app: news-crawler
    component: mongodb
  name: mongodb-data-pv
  namespace: news-crawler
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 20Gi
  hostPath:
    path: /srv/mongodb/news_crawler
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: news-crawler
    component: mongodb
  name: mongodb
  namespace: news-crawler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: news-crawler
      component: mongodb
  strategy: {}
  template:
    metadata:
      labels:
        app: news-crawler
        component: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:8.3.7
          args: ["--dbpath", "/data/db"]
          resources:
            limits:
              cpu: "600m"
              memory: "1Gi"
            requests:
              cpu: "300m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 6
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-creds
                  key: username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-creds
                  key: password
          volumeMounts:
            - name: "mongodb-data-dir"
              mountPath: "/data/db"
      volumes:
        - name: "mongodb-data-dir"
          persistentVolumeClaim:
            claimName: "mongodb-data"
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: news-crawler
    component: mongodb
  name: mongodb-nodeport-svc
  namespace: news-crawler
spec:
  type: NodePort
  ports:
    - port: 27017
      protocol: TCP
      targetPort: 27017
      nodePort: 32717
  selector:
    app: news-crawler
    component: mongodb
