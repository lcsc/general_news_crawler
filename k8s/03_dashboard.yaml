apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: news-crawler
    component: news-dashboard
  name: news-dashboard
  namespace: news-crawler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: news-crawler
      component: news-dashboard
  strategy: {}
  template:
    metadata:
      labels:
        app: news-crawler
        component: news-dashboard
    spec:
      containers:
        - name: news-dashboard
          image: mirror.lcsc.csic.es/lcsc/general_news_crawler_dashboard:latest
          resources:
            limits:
              cpu: "600m"
              memory: "2Gi"
            requests:
              cpu: "300m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /news/dashboard
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /news/dashboard
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: news-crawler
    component: news-dashboard
  name: news-dashboard-svc
  namespace: news-crawler
spec:
  type: ClusterIP
  ports:
    - port: 8080
      protocol: TCP
      targetPort: 80
  selector:
    app: news-crawler
    component: news-dashboard
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: news-dashboard-ingress
  namespace: news-crawler
spec:
  rules:
    - http:
        paths:
          - path: /news/dashboard
            pathType: Prefix
            backend:
              service:
                name: news-dashboard-svc
                port:
                  number: 8080
