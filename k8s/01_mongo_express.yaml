apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: news-crawler
    component: mongodb-express
  name: mongodb-express
  namespace: news-crawler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: news-crawler
      component: mongodb-express
  strategy: {}
  template:
    metadata:
      labels:
        app: news-crawler
        component: mongodb-express
    spec:
      containers:
        - name: mongodb-express
          image: mongo-express:1.0.2-20
          resources:
            limits:
              cpu: "1000m"
              memory: "2Gi"
            requests:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /news/mongo
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /news/mongo
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 6
          env:
            - name: ME_CONFIG_MONGODB_ADMINUSERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-creds
                  key: username
            - name: ME_CONFIG_MONGODB_ADMINPASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-creds
                  key: password
            - name: ME_CONFIG_MONGODB_URL
              value: "mongodb://$(ME_CONFIG_MONGODB_ADMINUSERNAME):$(ME_CONFIG_MONGODB_ADMINPASSWORD)@mongodb-svc:27017"
            - name: ME_CONFIG_BASICAUTH
              value: "false"
            - name: ME_CONFIG_SITE_BASEURL
              value: "/news/mongo"
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: news-crawler
    component: mongodb-express
  name: mongodb-express-svc
  namespace: news-crawler
spec:
  type: ClusterIP
  ports:
    - port: 8081
      protocol: TCP
      targetPort: 8081
  selector:
    app: news-crawler
    component: mongodb-express
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mongodb-express-ingress
  namespace: news-crawler
spec:
  rules:
    - http:
        paths:
          - path: /news/mongo
            pathType: Prefix
            backend:
              service:
                name: mongodb-express-svc
                port:
                  number: 8081
